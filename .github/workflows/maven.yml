name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
permissions:
  contents: write

jobs: 
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: compile
      run: mvn  compile
    - name: test
      run: mvn test
    - name: build
      run: mvn package 
      
  trivy-scan:
   runs-on: self-hosted
   needs: build

   steps:
     - name: code scan
       uses:  actions/checkout@v4
       
     - name: trivy-scan 
       uses: aquasecurity/trivy-action@v0.36.0
       with: 
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.html'
          severity: 'CRITICAL,HIGH,MEDIUM'
          
     - name: Upload HTML report
       uses: actions/upload-artifact@v4
       with:
          name: test-html-report
          path: path/to/trivy-results.html
